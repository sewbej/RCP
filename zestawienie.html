<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZESTAWIENIE GODZIN PRACY</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 5px; max-width: 700px; margin: auto; background-color: #ffffff; }
        .card { background: white; padding: 6px; border-radius: 12px; box-shadow: 0 0 1px 1px rgba(0,0,0,0.6); }
        h3 { text-align: center; color: #000; margin: 0; }
        label { display: block; margin-top: 6px; font-weight: bold; color: #000000; }
        input, select { width: 100%; padding: 6px; margin-top: 2px; border: 1px solid #000000; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        button { width: 100%; padding: 5px; background-color: #fff; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 1px 1px rgba(0,0,0,0.6);}
        button:hover { background-color: #000; color: #fff; }
        button:active { transform: scale(0.98); background-color: #1557b0; }
        button:disabled { background-color: #ccc; }

        .lang-btn {
            width: auto;
            margin-top: 0;
            margin-left: 6px;
            padding: 4px 10px;
            font-size: 18px;
            box-shadow: 0 0 1px 1px rgba(0,0,0,0.4);
        }

        #loader { display: none; text-align: center; margin-top: 20px; color: #000; font-weight: bold; }
        
        .results-container { margin-top: 5px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; font-size: 18px; }
        th { background-color: #ffffff; color: #000000; font-weight: bold; padding-top: 6px; border-bottom: 1px solid #888; text-align: center; font-size: 16px;}
        td { padding: 2px; border-bottom: 1px solid #888; color: #000; text-align: center;}
        tr:last-child td { border-bottom: none; }
        .no-data { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Przełącznik języków -->
        <div style="display: flex; justify-content: flex-end; gap: 5px; margin-bottom: 8px;">
            <button onclick="setLanguage('pl')" class="lang-btn" id="btn-pl">PL</button>
            <button onclick="setLanguage('en')" class="lang-btn" id="btn-en">EN</button>
            <button onclick="setLanguage('es')" class="lang-btn" id="btn-es">ES</button>
        </div>

        <h3 id="main-title">ZESTAWIENIE GODZIN PRACY</h3>

        <div style="display: flex; gap: 8px;">
            <div style="flex: 1;">
                <label id="label-year">Rok</label>
                <input type="number" id="yearInput">
            </div>
            <div style="flex: 2;">
                <label id="label-month">Miesiąc</label>
                <select id="monthSelect">
                </select>
            </div>
        </div>

        <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px; flex-wrap: wrap;">
            <input type="text" id="nameInput" placeholder="Wpisz imię i nazwisko" style="margin-top: 0; flex: 1; min-width: 150px;">
            <div style="display: flex; gap: 0px; align-items: center; margin-top: 0px; flex-wrap: wrap;">
                <button id="fetchBtn" onclick="getWorkHistory()" style="width: auto; margin-top: 0; padding: 12px 12px; font-size: 16px; white-space: nowrap;">POKAŻ GODZINY</button>
            </div>
        </div>

        <div id="loader">Pobieranie danych...</div>

        <div id="results" class="results-container">
            <!-- Tutaj wpadnie tabela -->
        </div>
    </div>

<script>
    // --- TU WKLEJ SWÓJ LINK DO GOOGLE SCRIPT ---
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfA6Ia_OP-gA1t5-COIvBSXN5IKrO3T9nFOQlY3z3zjg7j5iW4cFE9eOKqRILWfok/exec";

    // Słownik tłumaczeń interfejsu
    const translations = {
        pl: {
            title: "ZESTAWIENIE GODZIN PRACY",
            year: "Rok",
            month: "Miesiąc",
            months: ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"],
            placeholderName: "Wpisz imię i nazwisko",
            fetchBtn: "POKAŻ GODZINY",
            loader: "Pobieranie danych...",
            alertName: "Proszę wpisać nazwisko.",
            noData: "⚠️ Brak osoby o takim imieniu i nazwisku w wybranym okresie.",
            thDay: "dzień miesiąca",
            thStart: "rozpoczęcie",
            thEnd: "zakończenie",
            thTime: "czas pracy",
            totalHours: "SUMA GODZIN:",
            alertError: "Błąd połączenia. Sprawdź czy urządzenie ma internet i czy GOOGLE_SCRIPT_URL jest poprawny."
        },
        en: {
            title: "WORK HOURS SUMMARY",
            year: "Year",
            month: "Month",
            months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
            placeholderName: "Type full name",
            fetchBtn: "SHOW HOURS",
            loader: "Loading data...",
            alertName: "Please enter your name.",
            noData: "⚠️ No person with this name found in the selected period.",
            thDay: "day of month",
            thStart: "start time",
            thEnd: "end time",
            thTime: "work time",
            totalHours: "TOTAL HOURS:",
            alertError: "Connection error. Check if the device has internet and if GOOGLE_SCRIPT_URL is correct."
        },
        es: {
            title: "RESUMEN DE HORAS DE TRABAJO",
            year: "Año",
            month: "Mes",
            months: ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"],
            placeholderName: "Escribe nombre y apellido",
            fetchBtn: "MOSTRAR HORAS",
            loader: "Cargando datos...",
            alertName: "Por favor ingresa tu nombre.",
            noData: "⚠️ No se encontró ninguna persona con este nombre en el período seleccionado.",
            thDay: "día del mes",
            thStart: "inicio",
            thEnd: "fin",
            thTime: "tiempo de trabajo",
            totalHours: "TOTAL DE HORAS:",
            alertError: "Error de conexión. Comprueba si el dispositivo tiene internet y si GOOGLE_SCRIPT_URL es correcto."
        }
    };

    const monthValues = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
    let currentLang = localStorage.getItem('app_lang') || 'pl';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('app_lang', lang);

        // Podświetlenie aktywnego przycisku języka
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.style.backgroundColor = '#fff';
            btn.style.color = '#000';
        });
        const activeBtn = document.getElementById('btn-' + lang);
        if(activeBtn) {
            activeBtn.style.backgroundColor = '#000';
            activeBtn.style.color = '#fff';
        }

        const t = translations[lang];
        document.getElementById('main-title').innerText = t.title;
        document.getElementById('label-year').innerText = t.year;
        document.getElementById('label-month').innerText = t.month;
        document.getElementById('nameInput').placeholder = t.placeholderName;
        document.getElementById('fetchBtn').innerText = t.fetchBtn;
        document.getElementById('loader').innerText = t.loader;

        // Aktualizacja nazw miesięcy w liście rozwijanej
        const monthSelect = document.getElementById('monthSelect');
        const selectedValue = monthSelect.value || monthValues[now.getMonth()];
        monthSelect.innerHTML = '';
        for(let i = 0; i < 12; i++) {
            const opt = document.createElement('option');
            opt.value = monthValues[i]; // Wartość wysyłana do backendu Google
            opt.text = t.months[i];     // Wyświetlana nazwa w wybranym języku
            monthSelect.appendChild(opt);
        }
        monthSelect.value = selectedValue;
    }

    const now = new Date();
    
    window.addEventListener('DOMContentLoaded', () => {
        if(document.getElementById('yearInput')) document.getElementById('yearInput').value = now.getFullYear();
        setLanguage(currentLang);
    });

    async function getWorkHistory() {
        const name = document.getElementById('nameInput').value.trim();
        const month = document.getElementById('monthSelect').value;
        const year = document.getElementById('yearInput').value;
        const btn = document.getElementById('fetchBtn');
        const loader = document.getElementById('loader');
        const resultsDiv = document.getElementById('results');
        const t = translations[currentLang];

        if (!name) {
            alert(t.alertName);
            return;
        }

        const savedDeviceId = localStorage.getItem('app_device_id') || localStorage.getItem('device_id') || "";

        btn.disabled = true;
        loader.style.display = "block";
        resultsDiv.innerHTML = "";

        const payload = {
            action: "get_history",
            kod: name,
            miesiac: month,
            rok: year,
            deviceId: savedDeviceId
        };

        try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();

            if (data && data.status === "error") {
                resultsDiv.innerHTML = `<div style="color: red; font-weight: bold; text-align: center; padding: 20px;">${data.message}</div>`;
                loader.style.display = "none";
                return;
            }

            if (!data || !Array.isArray(data) || data.length === 0) {
                resultsDiv.innerHTML = `
                    <div style="color: #d32f2f; font-weight: bold; text-align: center; padding: 30px; border: 1px dashed #d32f2f; border-radius: 8px; margin-top: 20px; font-size: 16px; background-color: #ffebee;">
                        ${t.noData}
                    </div>`;
                loader.style.display = "none";
                return;
            }

            const dataMap = {};
            data.forEach(item => {
                if (!dataMap[item.dzien]) {
                    dataMap[item.dzien] = item;
                }
            });

            let calkowityCzasWMinutach = 0;

            let html = `<table>
                <thead>
                    <tr>
                        <th style="width: 60px;">${t.thDay}</th>
                        <th>${t.thStart}</th>
                        <th>${t.thEnd}</th>
                        <th>${t.thTime}</th>
                    </tr>
                </thead>
                <tbody>`;
            
            for (let d = 1; d <= 31; d++) {
                if (dataMap[d]) {
                    const czasPracy = dataMap[d].czas ? dataMap[d].czas.trim() : "";

                    if (czasPracy === "0:00" || czasPracy === "00:00" || czasPracy === "00:00:00") {
                        html += `<tr style="color: #888;">
                            <td style="font-weight: normal; color: #000;">${d}</td>
                            <td>---</td>
                            <td>---</td>
                            <td>---</td>
                        </tr>`;
                    } else {
                        html += `<tr>
                            <td style="font-weight: bold; color: #000;">${d}</td>
                            <td>${dataMap[d].rozpoczecie}</td>
                            <td>${dataMap[d].zakonczenie}</td>
                            <td>${czasPracy}</td>
                        </tr>`;

                        const częściCzasu = czasPracy.split(':');
                        if (częściCzasu.length >= 2) {
                            const godziny = parseInt(częściCzasu[0], 10) || 0;
                            const minuty = parseInt(częściCzasu[1], 10) || 0;
                            calkowityCzasWMinutach += (godziny * 60) + minuty;
                        }
                    }
                } else {
                    html += `<tr style="color: #888;">
                        <td style="font-weight: normal; color: #000;">${d}</td>
                        <td>---</td>
                        <td>---</td>
                        <td>---</td>
                    </tr>`;
                }
            }

            const sumaGodzin = Math.floor(calkowityCzasWMinutach / 60);
            const sumaMinut = calkowityCzasWMinutach % 60;
            const sformatowaneMinuty = sumaMinut.toString().padStart(2, '0');
            const ostatecznySumaCzasu = `${sumaGodzin}:${sformatowaneMinuty}`;

            html += `
                <tr style="background-color: #fff; font-size: 16px;">
                    <td colspan="3" style="text-align: right; font-weight: normal; padding: 6px; color: #000;">${t.totalHours}</td>
                    <td style="padding: 6px; color: #000; font-size: 20px;"><strong>${ostatecznySumaCzasu}</strong></td>
                </tr>`;

            html += '</tbody></table>';
            
            resultsDiv.innerHTML = html;
            loader.style.display = "none";

        } catch (error) {
            console.error(error);
            alert(t.alertError);
        } finally {
            btn.disabled = false;
            loader.style.display = "none";
        }
    }
</script>
</body>
</html>
